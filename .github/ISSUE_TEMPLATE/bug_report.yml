name: Bug report
description: Something is broken or incorrect
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues, use [Security Advisories](https://github.com/abhinavshyju/hands-mcp/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect vs what you saw?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. hands ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hands / commit
      placeholder: e.g. main @ abc1234 or global install date
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact tokens and paths if needed.
